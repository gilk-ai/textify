name: Build & test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Test
        # Hebrew checks skip without Tesseract; table checks skip before macOS 26.
        run: scripts/run-tests.sh "$(swift build -c release --show-bin-path)/Textify"
